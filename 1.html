  /* 方块盒css代码 */
  *{
            padding:0px;

        body {

        }

         audio{

            opacity: 0.5;
            position:absolute;
            left:50%;
            margin-left:-100px;
            bottom:50px;

        }

        .container2 {
            position: absolute;
            top: 50%;
            left: 55%;
            margin-left:-100px;
            width:100px;
            z-index: 5;
        }
        /* 主要用来装功能块在容器内保证定位 相当于该功能块的padding*/
        
        .container2 .wrap {
            width: 100px;
            height: 100px;
            top: 150px;
            left: 150px;
            margin: 0;
        }
        /* 功能块 */
        
        .container2 .wrap .cube {
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            /* perspective: 500px; */
            transform: rotateX(-30deg) rotateY(-80deg);
            animation: ziZhuan linear 20s infinite;
            animation-direction: alternate-reverse;
            transition: all 0.5s;
        }
        
        @keyframes ziZhuan {
            0% {
                transform: rotateX(0deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }
        
        .container2 .wrap .cube div {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            background-color: rgb(138, 187, 230);
            z-index: -1;
            transition: all 0.5s;
            opacity: 0.45;
            outline: rgb(56, 174, 217) solid thick;
            box-shadow: rgba(32, 101, 129, 0.712) 0 0 50px 50px;
        }
        
        .container2 .wrap .cube div img {
            width: 100%;
            height: 100%;
        }
        
        .container2 .wrap .cube span {
            position: absolute;
            top: 50px;
            left: 50px;
            display: block;
            width: 100px;
            height: 100px;
            outline: rgba(21, 40, 211, 0.664) solid thin;
            background-color: rgba(11, 96, 224, 0.295);
        }
        
        .container2 .wrap .cube span img {
            width: 100%;
            height: 100%;
        }
        
        .container2 .wrap .cube .out-front {
            transform: rotateY(0deg) translateZ(100px);
        }
        
        .container2 .wrap .cube .out-back {
            transform: translateZ(-100px);
        }
        /* //y正方向逆时针 */
        
        .container2 .wrap .cube .out-left {
            transform: rotateY(-90deg) translateZ(100px);
        }
        
        .container2 .wrap .cube .out-right {
            transform: rotateY(90deg) translateZ(100px);
        }
        /*  x->正-上*/
        
        .container2 .wrap .cube .out-top {
            transform: rotateX(90deg) translateZ(100px);
        }
        
        .container2 .wrap .cube .out-bottom {
            background-color: rgba(36, 238, 80, 0.253);
            transform: rotateX(-90deg) translateZ(100px);
        }
        
        .container2 .wrap .cube .in-left {
            transform: rotateY(-90deg) translateZ(50px);
        }
        
        .container2 .wrap .cube .in-right {
            transform: rotateY(90deg) translateZ(50px);
        }
        
        .container .wrap .cube .in-back {
            transform: translateZ(-50px);
        }
        
        .container2 .wrap .cube .in-front {
            transform: translateZ(50px);
        }
        
        .container2 .wrap .cube .in-top {
            transform: rotateX(90deg) translateZ(50px);
        }
        
        .container2 .wrap .cube .in-bottom {
            transform: rotateX(-90deg) translateZ(50px);
        }
        
        .container2 .wrap .cube:hover .out-front {
            transform: rotateY(0deg) translateZ(200px);
        }
        
        .container2 .wrap .cube:hover .out-back {
            transform: rotateY(0deg) translateZ(-200px);

<script>

  //显示页的js效果
    //判断客户端设备，选择写入meta
    function init_viewport() {
      if (navigator.userAgent.indexOf("Android") != -1) {
        var version = parseFloat(RegExp.$1);
        if (version > 2.3) {
          var width =
            window.outerWidth == 0 ? window.screen.width : window.outerWidth;
          var phoneScale = parseInt(width) / 500;
          document.write(
            '<meta name="viewport" content="width=500, minimum-scale = ' +
            phoneScale +
            ", maximum-scale = " +
            phoneScale +
            ', target-densitydpi=device-dpi">'
          );
        } else {
          document.write(
            '<meta name="viewport" content="width=500, target-densitydpi=device-dpi, user-scalable=0">'
          );
        }
      } else if (navigator.userAgent.indexOf("iPhone") != -1) {
        var phoneScale = parseInt(window.screen.width) / 500;
        document.write(
          '<meta name="viewport" content="width=500, min-height=750, initial-scale=' +
          phoneScale +
          ", maximum-scale=" +
          phoneScale +
          ', user-scalable=0" /> '
        ); //0.75   0.82
      } else {
        document.write(
          '<meta name="viewport" content="width=500, height=750, initial-scale=0.64" /> '
        ); //0.75  0.82
      }
    }

    function init_pure_words() {
      $(".div_pure_words_height").html(pure_words_content + "22222"); //初始化复制内容，撑开文档高度
      // 初始化设置div的bg图片 初始化设置div的bg图片
      if (

      ) {

          });
        }
      }
      //以下是打字效果的js
      if (
        typeof theme_content["cursor_char"] != "undefined" &&
        theme_content["cursor_char"] != ""
      ) {
        switch (
        theme_content["cursor_char"] //设置打字光标的样式
        ) {
          case "cursor_heart":
            str_cursorChar = '<um style="color: #F44336;">❤</um>';
            break;
          case "cursor_sub":
            str_cursorChar = "_";
            break;
          case "cursor_music":
            str_cursorChar = "♫";
            break;
          case "cursor_star":
            str_cursorChar = "★";
            break;
          case "cursor_sun":
            str_cursorChar = "☀";
            break;
          default:
            str_cursorChar = "|";
        }
      } else {
        //处理全新作品，默认显示打字效果
        str_cursorChar = "❤";
      }
      //判断用户有没有选择打字效果

        theme_content["typed_bool"] != ""
      ) {

      }
